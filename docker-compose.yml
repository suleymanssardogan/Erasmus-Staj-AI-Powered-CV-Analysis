version: '3.8'

services:
  web:
    build: .
    container_name: ocr-web-app
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - cv_data:/app/data
    restart: always
    environment:
      - ACCOUNT_DB_PATH=/app/data/accounts.db
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env before starting Docker}

volumes:
  cv_data:
